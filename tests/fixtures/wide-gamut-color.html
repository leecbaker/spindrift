<!doctype html>
<style>
  @page { size: 220pt 80pt; margin: 8pt }
  body { margin: 0; font: 12pt sans-serif; color: color(display-p3 1 .2 0) }
  .swatch { display: inline-block; width: 44pt; height: 44pt; margin-right: 4pt; border: 3pt solid color(display-p3 0 1 .2) }
  .p3 { background: color(display-p3 1 .2 0) }
  .rec2020 { background: color(rec2020 .85 .12 .04) }
  .lab { background: lab(58% 92 72) }
  .oklab { background: oklab(.72 .19 .12) }
  .linear { background: linear-gradient(to right, color(display-p3 1 .2 0), color(display-p3 0 .2 1)) }
  .radial { background: radial-gradient(color(rec2020 .85 .12 .04), color(rec2020 .1 .3 1)) }
  .conic { background: conic-gradient(color(display-p3 1 .2 0), color(display-p3 0 1 .2), color(display-p3 1 .2 0)) }
  .mixed { background: linear-gradient(to right, color(display-p3 1 .2 0), color(rec2020 .1 .3 1)) }
</style>
<p>Wide-gamut CSS Color 4</p>
<div class="swatch p3"></div><div class="swatch rec2020"></div><div class="swatch lab"></div><div class="swatch oklab"></div>
<div class="swatch linear"></div><div class="swatch radial"></div><div class="swatch conic"></div><div class="swatch mixed"></div>
