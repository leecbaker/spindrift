<!doctype html>
<meta charset="utf-8">
<title>Reference: Grid Lanes subgrid auto-fill line names</title>
<style>
  @page { size: 180px 180px; margin: 0 }
  html, body { margin: 0; padding: 0; }
  .grid {
    display: inline grid;
    grid-template-rows: repeat(7, 15px);
    border: 1px solid;
  }
  .subgrid {
    display: grid;
    grid-template-rows: subgrid repeat(auto-fill, [y]);
    grid-row: 3 / span 4;
    grid-auto-columns: 8px;
    background: grey;
  }
  .grid > .subgrid { grid-template-columns: auto; }
  .grid > .subgrid > .subgrid { grid-row: 1 / span 4; }
  .subgrid > .subgrid > :nth-child(2n) { background: black; }
  .subgrid > .subgrid > :nth-child(2n + 1) { background: pink; }
</style>
<div class="grid"><div class="subgrid"><div class="subgrid">
  <div style="grid-row: y 5"></div><div style="grid-row: y 4"></div>
  <div style="grid-row: y 3"></div><div style="grid-row: y 2"></div>
  <div style="grid-row: y 1"></div><div style="grid-row: y -1"></div>
  <div style="grid-row: y -2"></div><div style="grid-row: y -3"></div>
  <div style="grid-row: y -4"></div><div style="grid-row: y -5"></div>
</div></div></div>
