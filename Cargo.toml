[package]
name = "quire"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "A from-scratch Rust HTML/CSS to PDF renderer inspired by WeasyPrint."
repository = "https://github.com/lee/quire"
readme = "README.md"
keywords = ["html", "css", "pdf", "renderer", "weasyprint"]
categories = ["command-line-utilities", "rendering"]

[lib]
name = "quire"
path = "src/lib.rs"

[[bin]]
name = "quire"
path = "src/main.rs"

[[bench]]
name = "weasyprint_samples"
harness = false

[profile.release]
debug = 1
strip = false
lto = false #"thin"
split-debuginfo = "packed"

[profile.test]
opt-level = 1

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
cssparser = "0.37"
data-url = "0.3"
env_logger = "0.11"
euclid = "0.22"
fontique = "0.11"
html5ever = "0.39.0"
xml5ever = "0.39.0"
hyphenation = { version = "0.8.4", features = ["embed_all"] }
icu_casemap = "2.2"
icu_locale_core = "2.2"
icu_properties = "2.2"
icu_provider = { version = "2.2", features = ["logging"] }
icu_segmenter = "2.2"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
jiff = "0.2"
jxl-oxide = { version = "0.12.6", features = ["image", "moxcms"] }
kham-core = "0.8.2"
log = "0.4"
moxcms = { version = "0.9", features = ["extended_range"] }
os_info = { version = "3", default-features = false }
palette = { version = "0.7.6", default-features = false, features = ["std"] }
subsetter = { version = "0.2.6", default-features = false }
markup5ever_rcdom = "0.39.0"
miniz_oxide = "0.8.9"
parley = "0.11"
pdf-writer = "0.15"
png = "0.18.1"
precomputed-hash = "0.1.1"
read-fonts = "0.40.2"
sha2 = "0.10"
selectors = "0.40"
taffy = "0.13"
thiserror = "2"
tiny-skia-path = "0.12"
# `sync` is supported on every Quire target. Runtime and filesystem support
# are native-only; browser-Wasm currently compiles the library but does not
# provide a resource-loading backend.
tokio = { version = "1.52", default-features = false, features = ["sync"] }
ttf-parser = "0.25"
unicode-bidi = "0.3.18"
url = "2"
usvg = { version = "0.48", default-features = false }
wuff = { version = "0.2.8", default-features = false, features = ["z", "brotli"] }
kamadak-exif = "0.6.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1.52", default-features = false, features = ["rt", "fs"] }

[dev-dependencies]
criterion = "0.8.2"
# Test attributes and the example/benchmark multi-threaded runtimes are not
# required by the library or the command-line binary.
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }

[lints.rust]
missing_docs = "deny"

[lints.rustdoc]
missing_doc_code_examples = "deny"

[lints.clippy]
unused_async = "warn"
redundant_clone = "warn"
needless_collect = "warn"
unnecessary_to_owned = "warn"
clone_on_ref_ptr = "warn"
