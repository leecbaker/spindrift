[package]
name = "quire"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "A from-scratch Rust HTML/CSS to PDF renderer inspired by WeasyPrint."
repository = "https://github.com/lee/quire"
readme = "README.md"
keywords = ["html", "css", "pdf", "renderer", "weasyprint"]
categories = ["command-line-utilities", "rendering"]

[lib]
name = "quire"
path = "src/lib.rs"

[[bin]]
name = "quire"
path = "src/main.rs"

[[bench]]
name = "weasyprint_samples"
harness = false

[profile.release]
debug = 1
strip = false
lto = "thin"
split-debuginfo = "packed"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
cssparser = "0.37"
data-url = "0.3"
env_logger = "0.11"
euclid = "0.22"
fontique = "0.11"
html5ever = "0.39.0"
xml5ever = "0.39.0"
hyphenation = { version = "0.8.4", features = ["embed_all"] }
icu_casemap = "2.2"
icu_locale_core = "2.2"
icu_properties = "2.2"
icu_segmenter = "2.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log = "0.4"
lcms2 = "6.1.1"
subsetter = { version = "0.2.6", default-features = false }
markup5ever_rcdom = "0.39.0"
miniz_oxide = "0.8.9"
parley = "0.11"
pdf-writer = "0.15"
precomputed-hash = "0.1.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
sha2 = "0.10"
selectors = "0.38"
taffy = "0.12"
thiserror = "2"
tiny-skia-path = "0.12"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "fs", "sync"] }
ttf-parser = "0.25"
url = "2"
usvg = { version = "0.47", default-features = false }
woff2-patched = "0.4"

[dev-dependencies]
criterion = "0.8.2"

[lints.rust]
missing_docs = "deny"

[lints.rustdoc]
missing_doc_code_examples = "deny"

[lints.clippy]
redundant_clone = "warn"
needless_collect = "warn"
unnecessary_to_owned = "warn"
clone_on_ref_ptr = "warn"
